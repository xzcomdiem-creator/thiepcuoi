<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sổ lưu bút — Gia Hân & Minh Khôi</title>
<meta name="description" content="Gửi lời chúc mừng đến Gia Hân & Minh Khôi">
<link rel="stylesheet" href="css/rsvp.css">
</head>
<body>

<div class="page-wrap" style="max-width:760px;">

  <div class="mini-header">
    <a href="index.html"><span class="mono">H &amp; K</span></a>
  </div>

  <div class="card gb-form">
    <span class="eyebrow">Sổ lưu bút</span>
    <h1 class="page-title">Gửi lời chúc</h1>
    <p class="subtitle">Một lời chúc nhỏ của bạn sẽ là kỷ niệm quý giá trong ngày trọng đại của chúng tôi.</p>

    <form id="guestbookForm" novalidate>
      <div class="field">
        <label for="gbName">Tên của bạn</label>
        <input type="text" id="gbName" maxlength="60" placeholder="Nguyễn Văn A" required>
      </div>
      <div class="field">
        <label for="gbMessage">Lời chúc</label>
        <textarea id="gbMessage" maxlength="280" placeholder="Chúc hai bạn trăm năm hạnh phúc..." required></textarea>
        <div class="char-count"><span id="gbCharCount">0</span>/280</div>
      </div>
      <button type="submit" class="btn btn-primary" id="gbSubmitBtn">Gửi lời chúc 💌</button>
      <p class="form-msg" id="gbFormMsg"></p>
    </form>
  </div>

  <div style="height:32px;"></div>

  <h2 style="text-align:center;font-family:var(--font-display);color:var(--wine-dark);font-weight:600;font-size:24px;margin-bottom:20px;">
    💐 Lời chúc từ mọi người
  </h2>

  <div id="gbList" class="gb-list">
    <p class="gb-empty">Đang tải lời chúc…</p>
  </div>

  <p class="mini-footer" style="margin-top:40px;">Gia Hân &amp; Minh Khôi · 14.02.2027</p>
</div>

<script type="module" src="js/guestbook.js"></script>
</body>
</html>
