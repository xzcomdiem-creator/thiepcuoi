<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập quản trị — Gia Hân & Minh Khôi</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="login-shell">
  <div class="login-card">
    <div class="login-mono">H &amp; K</div>
    <p class="login-sub">Đăng nhập khu vực quản trị</p>

    <form id="loginForm" novalidate>
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="username" required>

      <label for="password">Mật khẩu</label>
      <input type="password" id="password" autocomplete="current-password" required>

      <button type="submit" class="login-btn" id="loginBtn">Đăng nhập</button>
      <p class="login-error" id="loginError"></p>
    </form>

    <a href="index.html" class="login-back">← Về trang thiệp cưới</a>
  </div>
</div>

<script type="module">
  import { auth } from "./js/firebase-config.js";
  import {
    signInWithEmailAndPassword,
    onAuthStateChanged,
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  // Nếu đã đăng nhập sẵn, chuyển thẳng vào trang quản trị
  onAuthStateChanged(auth, (user) => {
    if (user) window.location.href = "admin.html";
  });

  const form = document.getElementById("loginForm");
  const btn = document.getElementById("loginBtn");
  const errorEl = document.getElementById("loginError");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.textContent = "";
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    btn.disabled = true;
    btn.textContent = "Đang đăng nhập…";

    try {
      await signInWithEmailAndPassword(auth, email, password);
      window.location.href = "admin.html";
    } catch (err) {
      console.error(err);
      const map = {
        "auth/invalid-credential": "Email hoặc mật khẩu không đúng.",
        "auth/invalid-email": "Email không hợp lệ.",
        "auth/too-many-requests": "Bạn đã thử quá nhiều lần. Vui lòng thử lại sau.",
        "auth/user-not-found": "Tài khoản không tồn tại.",
        "auth/wrong-password": "Email hoặc mật khẩu không đúng.",
      };
      errorEl.textContent = map[err.code] || "Đăng nhập thất bại. Vui lòng thử lại.";
      btn.disabled = false;
      btn.textContent = "Đăng nhập";
    }
  });
</script>
</body>
</html>
