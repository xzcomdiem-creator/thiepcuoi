<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cảm ơn bạn — Gia Hân & Minh Khôi</title>
<link rel="stylesheet" href="css/rsvp.css">
</head>
<body>

<div class="page-wrap">

  <div class="mini-header">
    <a href="index.html"><span class="mono">H &amp; K</span></a>
  </div>

  <div class="card" style="text-align:center;">
    <div class="thankyou-icon" id="thankyouIcon">💌</div>
    <span class="eyebrow">Đã ghi nhận</span>
    <h1 class="page-title" id="thankyouTitle">Cảm ơn bạn!</h1>
    <p class="subtitle" id="thankyouText">Phản hồi của bạn đã được gửi thành công.</p>

    <div class="gift-block" style="border-top:none;padding-top:0;margin-top:10px;">
      <p style="margin-bottom:18px;">Bạn có thể xem lại thiệp mời, để lại lời chúc trong sổ lưu bút, hoặc lưu ngày cưới vào lịch của mình.</p>
    </div>

    <div class="actions-row">
      <a href="guestbook.html" class="btn btn-primary" style="text-decoration:none;">✍️ Viết lời chúc</a>
      <a href="index.html" class="btn btn-ghost" style="text-decoration:none;">🏠 Về trang thiệp</a>
    </div>

    <div class="share-row">
      <a class="share-btn" id="shareZalo" title="Chia sẻ qua Zalo" target="_blank" rel="noopener">Z</a>
      <a class="share-btn" id="shareFacebook" title="Chia sẻ qua Facebook" target="_blank" rel="noopener">f</a>
      <a class="share-btn" id="shareMessenger" title="Chia sẻ qua Messenger" target="_blank" rel="noopener">M</a>
    </div>
  </div>

  <p class="mini-footer">Gia Hân &amp; Minh Khôi · 14.02.2027</p>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const name = params.get("name");
  const status = params.get("status");

  const icon = document.getElementById("thankyouIcon");
  const title = document.getElementById("thankyouTitle");
  const text = document.getElementById("thankyouText");

  if (status === "yes") {
    icon.textContent = "🎉";
    title.textContent = name ? `Hẹn gặp bạn, ${name}!` : "Hẹn gặp bạn!";
    text.textContent = "Cảm ơn bạn đã xác nhận tham dự. Chúng tôi rất mong được đón tiếp bạn trong ngày trọng đại này.";
  } else if (status === "no") {
    icon.textContent = "🤍";
    title.textContent = name ? `Cảm ơn ${name}` : "Cảm ơn bạn";
    text.textContent = "Chúng tôi rất tiếc vì bạn không thể tham dự. Cảm ơn bạn đã dành thời gian phản hồi — tình cảm của bạn vẫn luôn được trân trọng.";
  }

  const shareText = encodeURIComponent("Thiệp mời cưới Gia Hân & Minh Khôi 💍");
  const shareUrl = encodeURIComponent(location.origin + location.pathname.replace(/thankyou\.html.*/, "index.html"));
  document.getElementById("shareFacebook").href = `https://www.facebook.com/sharer/sharer.php?u=${shareUrl}`;
  document.getElementById("shareMessenger").href = `https://www.facebook.com/dialog/send?link=${shareUrl}&app_id=&redirect_uri=${shareUrl}`;
  document.getElementById("shareZalo").href = `https://zalo.me/share?u=${shareUrl}&t=${shareText}`;
</script>
</body>
</html>
