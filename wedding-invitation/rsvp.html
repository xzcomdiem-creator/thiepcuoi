     Nhớ đổi "https://ten-mien-cua-ban.com" thành domain thật khi deploy. -->
<meta property="og:type" content="website">
<meta property="og:title" content="Xác Nhận Tham Dự — Gia Hân & Minh Khôi">
<meta property="og:description" content="Xác nhận tham dự lễ cưới Gia Hân & Minh Khôi">
<meta property="og:image" content="https://ten-mien-cua-ban.com/assets/images/og-cover.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">

<!-- Tải font kiểu "không chặn render": trình duyệt tải CSS font song song, không phải đợi
     xong mới vẽ trang — quan trọng khi khách mở link trên mạng yếu (3G/4G chập chờn). -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/rsvp.css">
</head>
<body>

<div class="subpage-header">
  <a href="index.html" class="back-link">← Về trang thiệp cưới</a>
  <div class="monogram-sm" id="monogramSm">H &amp; K</div>
  <h1>Xác Nhận Tham Dự</h1>
  <p id="rsvpGreeting">Kính mời quý khách xác nhận tham dự</p>
</div>

<div class="deadline-banner" id="deadlineBanner"></div>

<div class="form-wrap">
  <div class="form-card">
    <form id="rsvpForm" novalidate>
      <!-- Honeypot chống bot — người dùng thật sẽ không thấy field này -->
      <div class="hp-field" aria-hidden="true">
        <label for="website">Để trống trường này</label>
        <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
      </div>

      <div class="field">
        <label for="rsvpName">Họ và tên</label>
        <input type="text" id="rsvpName" name="name" maxlength="100" required placeholder="Nhập họ tên của bạn">
      </div>

      <div class="field">
        <label>Bạn có thể tham dự không?</label>
        <div class="pill-group">
          <label class="pill-choice">
            <input type="radio" name="attending" id="attendYes" value="yes" required>
            <span>🎉 Có, tôi sẽ đến</span>
          </label>
          <label class="pill-choice">
            <input type="radio" name="attending" id="attendNo" value="no">
            <span>💐 Xin phép vắng mặt</span>
          </label>
        </div>
      </div>

      <div class="conditional-field" id="attendingExtra">
        <div class="field">
          <label for="guestCount">Số người tham dự (bao gồm bạn)</label>
          <div class="stepper">
            <button type="button" id="stepDown" aria-label="Giảm">−</button>
            <input type="number" id="guestCount" name="guestCount" min="1" value="1">
            <button type="button" id="stepUp" aria-label="Tăng">＋</button>
          </div>
        </div>

        <div class="field">
          <label>Thực đơn</label>
          <div class="pill-group">
            <label class="pill-choice">
              <input type="radio" name="meal" id="mealMan" value="man">
              <span>🍖 Mặn</span>
            </label>
            <label class="pill-choice">
              <input type="radio" name="meal" id="mealChay" value="chay">
              <span>🥦 Chay</span>
            </label>
          </div>
        </div>
      </div>

      <div class="field">
        <label for="rsvpMessage">Lời nhắn gửi cô dâu chú rể (không bắt buộc)</label>
        <textarea id="rsvpMessage" name="message" maxlength="500" placeholder="Chúc mừng hai bạn..."></textarea>
      </div>

      <div class="submit-row">
        <button type="submit" class="btn solid" id="rsvpSubmitBtn">Gửi xác nhận</button>
      </div>

      <div class="form-status" id="formStatus"></div>
    </form>
  </div>

  <p class="consent-note">Bằng việc gửi form này, bạn đồng ý với <a href="privacy.html">Chính sách bảo mật</a> và <a href="terms.html">Điều khoản sử dụng</a> của trang.</p>

  <p class="closed-note" id="closedNote" style="display:none;"></p>
</div>

<script src="js/config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/guest-directory.js"></script>
<script src="js/rsvp.js"></script>
</body>
</html>
